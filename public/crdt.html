  if (k <= 0.01) return; const mx = (x0 + x1) / 2 - (y1 - y0) * bend, my = (y0 + y1) / 2 + (x1 - x0) * bend;
  const q = u => [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * mx + u * u * x1, (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * my + u * u * y1];
  g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; if (dash) g.setLineDash(dash);
  g.beginPath(); g.moveTo(x0, y0); for (let i = 1; i <= 20; i++) { const p = q(k * i / 20); g.lineTo(p[0], p[1]); } g.stroke(); g.setLineDash([]);
  const a = q(k), b = q(Math.max(0, k - 0.08)), an = Math.atan2(a[1] - b[1], a[0] - b[0]), h = lw * 3.3 * Math.min(1, k * 4);
  g.fillStyle = col; g.beginPath(); g.moveTo(a[0] + Math.cos(an) * h * 0.7, a[1] + Math.sin(an) * h * 0.7); g.lineTo(a[0] + Math.cos(an + 2.45) * h, a[1] + Math.sin(an + 2.45) * h); g.lineTo(a[0] + Math.cos(an - 2.45) * h, a[1] + Math.sin(an - 2.45) * h); g.closePath(); g.fill();
}

  withAlpha(g, seg(t, t0 + 0.05, t0 + 0.3), () => label(g, title, 178, 129, f, INK));
}

// ── 副本小人：一个带天线的圆球。原点在身体中心。 ──

  const blink = m !== 'surprise' && (t * 0.9 + (o.who === 'A' ? 0 : 1.7)) % 3.4 < 0.12;
  g.save(); g.translate(x, y + 42); g.scale(s * (1 + sq * 0.14), s * (1 - sq * 0.18)); g.translate(0, -42);
  g.strokeStyle = INK; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, -40); g.quadraticCurveTo(4 * Math.sin(t * 3), -52, 6 * Math.sin(t * 3), -60); g.stroke(); disc(g, 6 * Math.sin(t * 3), -65, 7, m === 'sleep' ? FAINT : HI, 3);
  disc(g, 0, 0, 42, m === 'sleep' ? '#c9c4b8' : c, 4);
  const lx = (o.look ? o.look[0] : 0) * 5, ly = (o.look ? o.look[1] : 0) * 4;
  for (const sx of [-15, 15]) {
    if (m === 'happy') { g.strokeStyle = INK; g.lineWidth = 4.5; g.lineCap = 'round'; g.beginPath(); g.arc(sx, 0, 8, Math.PI * 1.12, Math.PI * 1.88); g.stroke(); continue; }
    if (m === 'sleep' || blink) { g.strokeStyle = INK; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(sx - 8, -4); g.lineTo(sx + 8, -4); g.stroke(); continue; }
    const big = m === 'surprise' ? 1.22 : 1;
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(sx, -5, 10.5 * big, 12.5 * big, 0, 0, TAU); g.fill(); g.strokeStyle = INK; g.lineWidth = 2.5; g.stroke();
    g.fillStyle = INK; circ(g, sx + lx, -5 + ly, m === 'surprise' ? 3.2 : 5); g.fill();
    if (m === 'worried') { g.strokeStyle = INK; g.lineWidth = 3.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(sx - 9 * Math.sign(sx), -24); g.lineTo(sx + 7 * Math.sign(sx), -19); g.stroke(); }
  }
  g.strokeStyle = INK; g.lineWidth = 3.5; g.lineCap = 'round'; g.beginPath();
  if (m === 'happy') g.arc(0, 12, 9, 0.15 * Math.PI, 0.85 * Math.PI);
  else if (m === 'surprise') g.ellipse(0, 20, 5, 6.5, 0, 0, TAU);
  else if (m === 'worried') g.arc(0, 27, 8, 1.2 * Math.PI, 1.8 * Math.PI);
  else if (m === 'sleep') { g.moveTo(-4, 19); g.lineTo(4, 19); }

  g.stroke();
  g.restore();
}

// 两个节点之间的双向指针。a = 左节点右缘，b = 右节点左缘

// 一行链表：已经落在这一行上的节点，相邻两个之间画指针；悬在半空的不算

    rim(i0, f, dur, amp, pan) { const len = Math.round(0.08 * SR), d = Math.exp(-1 / (0.012 * SR)); let e = 1;
      for (let i = 0; i < len; i++) { put(i0 + i, amp * e * (0.7 * Math.sin(TAU * 1750 * i / SR) + 0.5 * (rnd() * 2 - 1)), pan); e *= d; } },
    pop(i0, f, dur, amp, pan) { const len = Math.round(0.18 * SR), d = Math.exp(-1 / (0.04 * SR)); let ph = 0, e = 1;
      for (let i = 0; i < len; i++) { ph += TAU * f * (1 + 0.55 * Math.min(1, i / (0.05 * SR))) / SR; put(i0 + i, amp * e * Math.min(1, i / 40) * Math.sin(ph), pan); e *= d; } },
    tick(i0, f, dur, amp, pan) { const len = Math.round(0.04 * SR), d = Math.exp(-1 / (0.007 * SR)); let e = 1;
      for (let i = 0; i < len; i++) { put(i0 + i, amp * e * (0.6 * Math.sin(TAU * f * i / SR) + 0.5 * (rnd() * 2 - 1)), pan); e *= d; } },
    whoosh(i0, f, dur, amp, pan) { const len = Math.round(dur * SR); let y1 = 0, y2 = 0;
      for (let i = 0; i < len; i++) { const k = i / len, s = Math.sin(k * Math.PI), x = rnd() * 2 - 1; y1 += (0.03 + 0.3 * s * s) * (x - y1); y2 += 0.02 * (y1 - y2); put(i0 + i, amp * s * s * (y1 - y2) * 3, pan * (2 * k - 1)); } },
    ding(i0, f, dur, amp, pan) { const len = Math.round(1.3 * SR), d = Math.exp(-1 / (0.3 * SR)); let e = 1;
      for (let i = 0; i < len; i++) { const ph = TAU * f * i / SR; put(i0 + i, amp * e * Math.min(1, i / 60) * (Math.sin(ph) + 0.4 * e * Math.sin(ph * 2.76) + 0.3 * Math.sin(ph * 1.5)), pan); e *= d; } },
    thud(i0, f, dur, amp, pan) { const len = Math.round(0.2 * SR), d = Math.exp(-1 / (0.05 * SR)), q = Math.exp(-1 / (0.02 * SR)); let ph = 0, e = 1, sw = 1;
      for (let i = 0; i < len; i++) { ph += TAU * (60 + 70 * sw) / SR; put(i0 + i, amp * (e * Math.sin(ph) + (i < 200 ? (rnd() * 2 - 1) * 0.3 * (1 - i / 200) : 0)), pan); e *= d; sw *= q; } },
    buzz(i0, f, dur, amp, pan) { const len = Math.round(dur * SR); let y = 0;
      for (let i = 0; i < len; i++) { const x = (Math.sin(TAU * f * i / SR) > 0 ? 1 : -1) + (Math.sin(TAU * f * 1.06 * i / SR) > 0 ? 1 : -1); y += 0.12 * (x - y); put(i0 + i, amp * 0.5 * y * Math.min(1, i / 300, (len - i) / 1500), pan); } },
  };
  let last = performance.now();
  for (let i = 0; i < ev.length; i++) { const e = ev[i]; V[e[0]](Math.max(0, Math.round(e[1] * SR)), e[2], e[3], e[4], e[5]);
    if (performance.now() - last > 28) { onProgress(i / ev.length); await new Promise(r => setTimeout(r)); last = performance.now(); } }
  // 收束动态：按峰值定增益后软限幅，首尾淡变
  let peak = 1e-6; for (let i = 0; i < NS; i++) { const a = Math.abs(L[i]), b = Math.abs(R[i]); if (a > peak) peak = a; if (b > peak) peak = b; }
  const gain = 1.5 / peak, f0 = (K.FADE - 1.4) * SR, f1 = (DUR - 0.2) * SR;
  for (let i = 0; i < NS; i++) { const k = Math.min(1, i / (0.2 * SR)) * (i < f0 ? 1 : i > f1 ? 0 : Math.pow(1 - (i - f0) / (f1 - f0), 1.6)); L[i] = Math.tanh(L[i] * gain) * 0.86 * k; R[i] = Math.tanh(R[i] * gain) * 0.86 * k; }
  return [L, R];
}

// ───────────────────────── 播放器 ─────────────────────────
const $ = id => document.getElementById(id);
const cv = $('view'), g = cv.getContext('2d'), seek = $('seek'), pp = $('pp'), go = $('go'), statusEl = $('status'), startEl = $('start'), chapEl = $('chapters');
MG = document.createElement('canvas').getContext('2d');
let scale = 1, pos = 0, playing = false, ctx = null, buf = null, src = null, base = 0, wall = 0, pcm = null, raf = 0, idleTimer = 0, dragging = false;
const chapBtns = CHAPTERS.map(c => { const b = document.createElement('button'); b.textContent = c.n; b.onclick = () => { seekTo(c.t); poke(); }; chapEl.appendChild(b); return b; });
seek.max = DUR;
function paint() {
  g.setTransform(scale, 0, 0, scale, 0, 0); frame(g, pos);
  if (!dragging) seek.value = pos;
  $('time').textContent = `${mmss(pos)} / ${mmss(DUR)}`; pp.textContent = playing ? '❚❚' : '▶';
  let cur = 0; CHAPTERS.forEach((c, i) => { if (pos >= c.t - 0.45) cur = i; }); chapBtns.forEach((b, i) => b.classList.toggle('on', i === cur));
}
function fit() {
  const s = Math.min(innerWidth / SW, innerHeight / SH), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = `${SW * s}px`; cv.style.height = `${SH * s}px`; cv.width = Math.round(SW * s * dpr); cv.height = Math.round(SH * s * dpr); scale = cv.width / SW; paint();
}
const clock = () => (ctx ? ctx.currentTime - base : (performance.now() - wall) / 1000);
function tick() { if (!playing) return; pos = clock(); if (pos >= DUR) { pos = DUR; pause(); ended(); return; } paint(); raf = requestAnimationFrame(tick); }
function play() {
  if (playing) return; if (pos >= DUR - 0.05) pos = 0;
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start(0, pos); base = ctx.currentTime - pos; } else wall = performance.now() - pos * 1000;
  playing = true; document.body.classList.add('playing'); poke(); raf = requestAnimationFrame(tick);
}
function pause() {
  if (!playing) return; pos = clamp(clock(), 0, DUR); playing = false; cancelAnimationFrame(raf);
  if (src) { try { src.stop(); } catch (e) { /* 已经停了 */ } src.disconnect(); src = null; }
  document.body.classList.remove('playing'); paint();
}
function seekTo(t) { const was = playing; if (was) pause(); pos = clamp(t, 0, DUR - 0.01); if (was) play(); else paint(); }
function ended() { go.textContent = '↻ 再看一遍'; statusEl.textContent = ''; startEl.classList.remove('hide'); }
function poke() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2600); }
function fullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); }

go.onclick = () => {
  if (!ctx && pcm) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); buf = ctx.createBuffer(2, NS, SR); buf.copyToChannel(pcm[0], 0); buf.copyToChannel(pcm[1], 1); } catch (e) { ctx = null; } }
  startEl.classList.add('hide'); document.body.classList.add('started'); pos = 0; play();
};
pp.onclick = () => (playing ? pause() : play());
cv.onclick = () => { if (playing) pause(); else play(); poke(); };
$('fs').onclick = fullscreen;
seek.addEventListener('pointerdown', () => { dragging = true; });
seek.addEventListener('input', () => { seekTo(+seek.value); poke(); });
seek.addEventListener('change', () => { dragging = false; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', poke);
addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (!document.body.classList.contains('started') || !startEl.classList.contains('hide')) return;
  if (e.code === 'Space') { e.preventDefault(); if (playing) pause(); else play(); }
  else if (e.code === 'ArrowRight') seekTo(pos + 5); else if (e.code === 'ArrowLeft') seekTo(pos - 5); else if (e.code === 'Home') seekTo(0); else if (e.code === 'KeyF') fullscreen(); else return;
  poke();
});

fit();
synth(p => { statusEl.textContent = `正在合成配乐… ${Math.round(p * 100)}%`; })
  .then(r => { pcm = r; statusEl.textContent = '配乐已就绪 · 空格暂停 · F 全屏'; })
  .catch(() => { statusEl.textContent = '配乐合成失败，将静音播放'; })
  .finally(() => { go.disabled = false; });
})();
</script>
