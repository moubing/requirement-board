<script>
(() => {
'use strict';
// ───────────────────────── 基础数学 ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));          // t 在 [a,b] 内的线性进度
const smooth = k => k * k * (3 - 2 * k);
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eOutBack = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const bump = (t, t0, d) => { const k = (t - t0) / d; return k < 0 || k > 1 ? 0 : Math.sin(k * Math.PI); };
const decay = (t, t0, tau) => (t < t0 ? 0 : Math.exp(-(t - t0) / tau));   // 事件后的指数衰减
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) {                                         // mulberry32：可复现随机数
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// 关键帧轨道：keys = [[t, v, ease?], ...]；ease 作用于“到达该关键帧”的那一段
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i], k = (t - a[0]) / (b[0] - a[0] || 1e-9);
      return lerp(a[1], b[1], (b[2] || eInOut)(k));
    }
  }
  return keys[keys.length - 1][1];
}

// ───────────────────────── 时间线（画面与声音共用） ─────────────────────────
// 120 BPM：一拍 0.5 秒，一小节 2 秒，十六分音符 0.125 秒。所有事件都落在这张网格上。

// 再用选区历史查出是谁；恢复之后请 Claude 加上限，嫌疑人撞锁。
const S16 = 0.125, BEAT = 0.5, BAR = 2, DUR = 96;

const E = {
  // 一 · 写需求

  DET_OPEN: 8.5, CHK1: 12.0,
  PEEK: 9.0, GASP: 9.75, HMPH: 11.0, DUCK: 11.5,              // 咪咪在页边偷看
  HOP: [12.5, 12.75, 13.0], SAVE1: 14.0, SHADES: 15.0, LEAVE: 16.5,
  // 二 · 夜里
  NIGHT: 18.0, THIEF: 19.5, N_CO: 21.0, N_CODE1: 22.0, N_CODE2: 22.5, N_DET: 23.5, N_TASK: 24.5, SNICK: 25.0, FLEE: 25.5,

  // 五 · 查来处
  HAT: 53.5, SEL0: 54.5, SEL1: 55.25, D1a: 56.0, D1b: 57.0, CLEAR: 57.5, D2a: 58.5, D2b: 59.5, HIT: 60.0, ACCUSE: 60.5,
  MAG: 62.0, STING1: 63.0, STING2: 63.5, REVEAL: 64.0, UNMASK: 64.625, BACK: 66.0,
  CAUGHT: 67.0, WHISTLE: 68.0, MARK: 70.0, R_CO: 70.5, R_CODE: 71.0, R_DET: 71.5, R_TASK: 72.0, FLOP: 72.5,
  // 六 · AI 上锁
  AI: 74.0, TERM: 76.0, LOCK: 77.0, BONK: 78.5, GHOST: 79.5, SUBMIT: 81.0, UNLOCK: 82.0, SIGN: 82.5,
  // 七 · 结尾
  TREAT: 84.0, PERK: 86.25, HEART: 87.0, SAVE4: 87.5, OUT: 88.5, CARD: 90.0, GUILT: 92.5, URL: 93.25, FINAL: 94.0,
};

const CHAPTERS = [
  { t: 0, n: '写需求' }, { t: 18, n: '夜里' }, { t: 26, n: '照常' }, { t: 32, n: '看变化' },
  { t: 52, n: '查来处' }, { t: 74, n: 'AI 上锁' }, { t: 84, n: '结尾' },
];
const VERS = [
  { n: 1, when: '周一 18:00', who: 'A', t: E.SAVE1 }, { n: 2, when: '周二 10:05', who: 'M', t: E.SAVE2 },
  { n: 3, when: '周三 09:30', who: 'A', t: E.SAVE3 }, { n: 4, when: '周四 09:40', who: 'A', t: E.SAVE4 },
];
// 画面角落的时间：只在时间跳动时出现
const CAPS = [
  [0.4, 4.6, '周一 17:40', 0], [E.NIGHT + 0.5, E.DAY2 - 0.25, '周二 03:12', 1], [E.DAY2 + 0.1, E.DAY3 - 0.2, '周二 10:05', 0],
  [E.DAY3, E.DAY4 - 0.2, '周三 09:30', 0], [E.DAY4, E.DARK - 0.4, '周四 09:00', 0],
];

// 打字任务：text 中的 '|' 表示停一个音符（想一下再继续）
function job(who, block, text, t0, step = S16, cell = null) {
  const times = []; let k = 0, str = '';
  for (const ch of text) { if (ch === '|') { k++; continue; } times.push(t0 + k * step); str += ch; k++; }
  return { who, block, cell, text: str, times, t0, t1: times[times.length - 1] };
}
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const typed = (j, t) => { let n = 0; while (n < j.times.length && j.times[n] <= t) n++; return n; };

const J = {
  h1: job('A', 'h1', '自动喂食器| · |定时开饭', 0.75),
  p1: job('A', 'p1', '每天 18:00 开饭，|只吃一顿。', 3.0),
  co: job('M', 'co', '咪咪在减肥，|不许加餐。', 6.75),
  c1: job('A', 'code', 'time: "18:00"', 7.0, S16 / 2, 0),
  c2: job('A', 'code', 'times_per_day: 1', 8.0, S16 / 2, 1),
  c3: job('A', 'code', 'grams: 60', 9.25, S16 / 2, 2),
  ds: job('S', 'det', '为什么只吃一顿？', 7.25),
  db: job('S', 'detb', '医生说的。|咪咪抗议，|抗议无效。', 8.75),
  t1: job('M', 't1', '写好定时任务', 9.5),
  t3: job('M', 't3', '咪咪验收', 10.75),
  t4: job('M', 't4', '再买一袋猫粮', 26.75),
  t5: job('A', 't5', '怎么又空了？再买一袋', 29.5),
  ann: job('M', 'ann', '加个上限，|别让猫再改', 74.5),
  c4: job('C', 'code', 'max_per_day: 2', E.SUBMIT, S16 / 4, 3),
  t6: job('M', 't6', '周五加餐：小鱼干', 85.0),
};

// 终端里的三步：快照（加锁）→ 校验 → 提交
const TERM = [
  { t: 76.5, cmd: 'rb snapshot REQ-128' },
  { t: E.LOCK, out: '✓ 不可变快照 a3f9 · 独占编辑锁', c: 'ok' },
  { t: 79.0, cmd: 'rb validate' },
  { t: E.GHOST, out: '✓ 候选结果通过 · 尚未写入', c: 'ok' },
  { t: 80.5, cmd: 'rb submit' },
  { t: E.SUBMIT, out: '✓ 基线一致 · 已写入共同草稿', c: 'ok' },
];
const TERM_STEP = 0.018;   // AI 敲命令的速度

// 对白气泡（世界坐标，跟着角色）：[开始, 结束, 角色, 台词]
const LINES = [
  [E.SHADES + 0.1, 16.4, 'S', '休假三天～'],
  [E.ASK1, 34.35, 'S', '三天，两袋猫粮？'], [E.ASK2, 35.75, 'S', '我不在这几天，改了什么？'],
  [E.KIND[1] + 1.0, E.KIND[1] + 1.9, 'S', '一天九顿？！'],
  [E.WHO, 49.95, 'S', '谁改的？'], [E.NOTME1, 51.3, 'M', '不是我'], [E.NOTME2, 51.5, 'A', '不是我'],
  [E.TREAT + 0.2, 84.95, 'M', '……好吧'],
];

// ───────────────────────── 配乐与拟音：逐采样合成 ─────────────────────────
// D 大调 / b 小调，120 BPM。白天是大调的合奏；夜里和侦查段转到关系小调，低音改成踮脚的拨弦和走路低音。
// 声部：主旋律(lead) · 三人打字声部(马林巴/拨弦/钟琴) · AI 琶音 · 和声垫 · 低音 · 鼓组。
// 每一次按键就是所属声部的一个音符：一个人写是独奏，三个人写是合奏。
const SR = 44100, TAU = Math.PI * 2;

function synthScore() {
  const N = Math.ceil((DUR + 1) * SR);
  const MUS = [new Float32Array(N), new Float32Array(N)];
  const SFX = [new Float32Array(N), new Float32Array(N)];
  const SEND = new Float32Array(N);
  const R = rng(20261116);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const noise = () => R() * 2 - 1;

  function add(bus, t0, dur, pan, send, fn) {
    const i0 = Math.max(0, Math.round(t0 * SR)), n = Math.min(N - i0, Math.round(dur * SR));
    const gl = Math.cos((pan + 1) * Math.PI / 4), gr = Math.sin((pan + 1) * Math.PI / 4);
    const L = bus[0], Rt = bus[1];
    for (let i = 0; i < n; i++) {
      const s = fn(i / SR) * Math.min(1, i / 40) * Math.min(1, (n - i) / 260);
      L[i0 + i] += s * gl; Rt[i0 + i] += s * gr; if (send) SEND[i0 + i] += s * send;
    }
  }

  // ── 音色 ──
  const marimba = (t, m, v = 1, pan = 0, send = 0.22) => { const f = mtof(m);
    add(MUS, t, 0.7, pan, send, x => v * 0.30 * (Math.sin(TAU * f * x) * Math.exp(-x / 0.17) + 0.28 * Math.sin(TAU * f * 4 * x) * Math.exp(-x / 0.045) + 0.07 * Math.sin(TAU * f * 9.2 * x) * Math.exp(-x / 0.018))); };
  const bell = (t, m, v = 1, pan = 0, send = 0.4) => { const f = mtof(m);
    add(MUS, t, 1.3, pan, send, x => v * 0.17 * (Math.sin(TAU * f * x) * Math.exp(-x / 0.42) + 0.45 * Math.sin(TAU * f * 2.76 * x) * Math.exp(-x / 0.2) + 0.2 * Math.sin(TAU * f * 5.4 * x) * Math.exp(-x / 0.09))); };
  const pizz = (t, m, v = 1, pan = 0, send = 0.2) => { const f = mtof(m);
    add(MUS, t, 0.6, pan, send, x => v * 0.30 * (Math.sin(TAU * f * x) * Math.exp(-x / 0.2) + 0.5 * Math.sin(TAU * f * 2 * x) * Math.exp(-x / 0.1) + 0.25 * Math.sin(TAU * f * 3 * x) * Math.exp(-x / 0.06))); };
  const arp = (t, m, v = 1, pan = 0) => { const f = mtof(m); let ph = 0, lp = 0;
    add(MUS, t, 0.24, pan, 0.2, x => { ph += f / SR; ph -= Math.floor(ph); lp += ((ph < 0.36 ? 1 : -1) - lp) * 0.24; return v * 0.15 * lp * Math.exp(-x / 0.075); }); };
  const lead = (t, m, dur, v = 1, pan = 0) => { const f = mtof(m); let ph = 0;
    add(MUS, t, dur + 0.25, pan, 0.35, x => { const vib = 1 + 0.004 * Math.sin(TAU * 5.5 * x) * Math.min(1, x / 0.25); ph += f * vib / SR;
      const e = Math.min(1, x / 0.012) * (0.55 + 0.45 * Math.exp(-x / 0.4)) * (x > dur ? Math.exp(-(x - dur) / 0.07) : 1);
      const p = TAU * ph; return v * 0.2 * e * (Math.sin(p) + 0.3 * Math.sin(2 * p) + 0.14 * Math.sin(3 * p) + 0.05 * Math.sin(5 * p)); }); };
  const bass = (t, m, dur, v = 1) => { const f = mtof(m);
    add(MUS, t, dur + 0.08, 0, 0, x => { const e = Math.min(1, x / 0.005) * (0.45 + 0.55 * Math.exp(-x / 0.3)) * (x > dur ? Math.exp(-(x - dur) / 0.025) : 1);
      return v * 0.42 * e * Math.tanh(1.4 * (Math.sin(TAU * f * x) + 0.35 * Math.sin(TAU * 2 * f * x) + 0.1 * Math.sin(TAU * 3 * f * x))); }); };
  function pad(t, notes, dur, v) {
    const osc = []; notes.forEach(m => { osc.push({ f: mtof(m) * 1.003, p: R() }, { f: mtof(m) * 0.997, p: R() }); });
    const i0 = Math.round(t * SR), n = Math.min(N - i0, Math.round(dur * SR)); let l1 = 0, l2 = 0, r1 = 0, r2 = 0;
    for (let i = 0; i < n; i++) {
      const x = i / SR, env = Math.min(1, x / 0.7) * clamp((dur - x) / 0.6); let sl = 0, sr = 0;
      for (let k = 0; k < osc.length; k++) { const o = osc[k]; o.p += o.f / SR; if (o.p >= 1) o.p -= 1; const s = 2 * o.p - 1; if (k & 1) { sr += s * 0.75; sl += s * 0.25; } else { sl += s * 0.75; sr += s * 0.25; } }
      const c = 0.06 + 0.07 * env; l1 += (sl - l1) * c; l2 += (l1 - l2) * c; r1 += (sr - r1) * c; r2 += (r1 - r2) * c;
      const g = env * v * 0.075; MUS[0][i0 + i] += l2 * g; MUS[1][i0 + i] += r2 * g; SEND[i0 + i] += (l2 + r2) * g * 0.3;
    }
  }
  // ── 鼓组 ──
  const kick = (t, v = 1) => { let ph = 0; add(MUS, t, 0.4, 0, 0, x => { ph += (46 + 115 * Math.exp(-x / 0.032)) / SR; return v * 0.62 * (Math.sin(TAU * ph) * Math.exp(-x / 0.15) + 0.25 * noise() * Math.exp(-x / 0.003)); }); };
  const band = (lo, hi) => { let a = 0, b = 0; return () => { const n = noise(); a += (n - a) * hi; b += (n - b) * lo; return a - b; }; };
  const clap = (t, v = 1) => { const bp = band(0.07, 0.4); add(MUS, t, 0.3, 0.1, 0.3, x => { const e = Math.exp(-x / 0.006) + Math.exp(-Math.abs(x - 0.011) / 0.005) + Math.exp(-Math.abs(x - 0.023) / 0.005) + (x > 0.03 ? Math.exp(-(x - 0.03) / 0.07) : 0); return v * 0.2 * bp() * e; }); };
  const snare = (t, v = 1) => { const bp = band(0.1, 0.55); add(MUS, t, 0.25, -0.05, 0.2, x => v * 0.3 * (0.6 * Math.sin(TAU * 190 * x) * Math.exp(-x / 0.045) + bp() * Math.exp(-x / 0.08))); };
  const hat = (t, v = 1, open = false) => { let a = 0; add(MUS, t, open ? 0.3 : 0.08, 0.28, 0.05, x => { const n = noise(); a += (n - a) * 0.45; return v * 0.13 * (n - a) * Math.exp(-x / (open ? 0.09 : 0.02)); }); };
  const shaker = (t, v = 1) => { let a = 0; add(MUS, t, 0.1, -0.4, 0.1, x => { const n = noise(); a += (n - a) * 0.5; return v * 0.06 * (n - a) * Math.min(1, x / 0.012) * Math.exp(-x / 0.03); }); };
  const rim = (t, v = 1) => add(MUS, t, 0.12, -0.2, 0.4, x => v * 0.22 * (Math.sin(TAU * 1720 * x) + 0.5 * Math.sin(TAU * 820 * x) + 0.3 * noise()) * Math.exp(-x / 0.012));
  const crash = (t, v = 1) => { let a = 0; add(MUS, t, 2.2, 0, 0.5, x => { const n = noise(); a += (n - a) * 0.3; return v * 0.15 * (n - a) * Math.exp(-x / 0.6); }); };
  // ── 拟音（只给画面里真实发生的事） ──
  const key = (t, pan = 0, v = 1) => { const f = 1900 + R() * 900; add(SFX, t, 0.03, pan, 0.05, x => v * 0.075 * (noise() * Math.exp(-x / 0.0025) + 0.6 * Math.sin(TAU * f * x) * Math.exp(-x / 0.005))); };
  const tick = (t, v = 1) => add(SFX, t, 0.15, 0, 0.5, x => v * 0.1 * (Math.sin(TAU * 1175 * x) * Math.exp(-x / 0.03) + 0.3 * Math.sin(TAU * 2350 * x) * Math.exp(-x / 0.012)));

}

function fillRR(g, x, y, w, h, r, c) { g.fillStyle = c; rr(g, x, y, w, h, r); g.fill(); }

  const flashes = (name, a) => { if (!live) return; SWAP[name].forEach((T, n) => { const k = seg(t, T, T + 0.8); if (k <= 0 || k >= 1) return; const s = jobText(name, td);
    CHG[name][n ? 'old' : 'new'].forEach(([p, q]) => { const [x0, x1] = xr(a, s, p, q); fillRR(g, x0 - 4, a.yb - a.lh + 6, x1 - x0 + 8, a.lh + 2, 6, `rgba(${n ? '16,185,129' : '245,158,11'},${0.65 * (1 - k)})`); }); }); };

  { const a = anchor(J.h1, L); if (!typed(J.h1, td)) label(g, '输入标题', a.x, a.yb, a.f, '#d9dce1'); typedText(g, 'h1', td, a.x, a.yb, a.f, '#0f172a'); }

    g.fillStyle = '#3b82f6'; g.beginPath(); g.arc(CX0 + 31, y + 44, 12, 0, TAU); g.fill(); label(g, 'i', CX0 + 31, y + 52, mono(20, 700), '#fff', 'center');
    chips(0, 'co', a, old ? C.delBg : C.insBg); flashes('co', a);

// ── 咪咪：项目标志上的那只猫。原点在头的中心。 ──

    g.fillStyle = N ? '#5b4a50' : '#f7b9c4'; g.beginPath(); g.moveTo(sx * 44, -34); g.lineTo(lerp(sx * 56, tx, 0.75), lerp(-26, ty, 0.75)); g.lineTo(sx * 70, -18); g.closePath(); g.fill(); }

  for (const sx of [-1, 1]) { const ex = sx * 32, ey = -4;

    else if (e === 'heart') heart(g, ex, ey + 2, 2.1, '#f43f5e');
    else if (e === 'narrow') { g.fillStyle = iris; g.beginPath(); g.ellipse(ex, ey + 2, 15, 8, 0, 0, TAU); g.fill(); g.fillStyle = '#1b1b1b'; g.beginPath(); g.ellipse(ex + lx, ey + 3, 7, 6, 0, 0, TAU); g.fill();
      g.fillStyle = fur; g.fillRect(ex - 18, ey - 12, 36, 11); g.strokeStyle = dark; g.lineWidth = 4.5; g.beginPath(); g.moveTo(ex - sx * 17, ey - 6); g.lineTo(ex + sx * 15, ey + 1); g.stroke(); }

      g.fillStyle = '#fff'; g.beginPath(); g.arc(ex - 4 + lx, ey - 5 + ly, wd ? 2.5 : bg ? 5 : 4, 0, TAU); g.fill(); if (bg) { g.beginPath(); g.arc(ex + 5 + lx, ey + 6 + ly, 2.5, 0, TAU); g.fill(); } } }

  g.restore();

// ───────────────────────── 分镜：镜头、表演、每一帧 ─────────────────────────

function draw() {
  g.setTransform(cv.width / SW, 0, 0, cv.height / SH, 0, 0); g.globalAlpha = 1; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  renderFilm(g, clamp(T, 0, DUR));
  $('seek').value = T; $('time').textContent = `${mmss(T)} / ${mmss(DUR)}`;
  let ci = 0; CHAPTERS.forEach((c, i) => { if (T >= c.t) ci = i; }); document.querySelectorAll('#chapters button').forEach((b, i) => b.classList.toggle('on', i === ci));
}
const fmt = mmss;
function now() { return actx && node ? t0film + (actx.currentTime - t0ctx) : t0film + (performance.now() - t0wall) / 1000; }
function frame() {
  if (!playing) return; T = now();
  if (T >= DUR) { T = DUR; pause(); draw(); $('start').classList.remove('hide'); $('go').textContent = '↺ 再看一遍'; return; }
  draw(); $('time').textContent = `${fmt(T)} / ${fmt(DUR)}`; raf = requestAnimationFrame(frame);
}
function stopNode() { if (node) { try { node.onended = null; node.stop(); } catch (e) {} node = null; } }
function play() {
  if (playing) return; if (T >= DUR - 0.05) T = 0;
  if (score && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); abuf = actx.createBuffer(2, score.L.length, score.sr); abuf.copyToChannel(score.L, 0); abuf.copyToChannel(score.R, 1); } catch (e) { actx = null; } }
  if (actx) { if (actx.state === 'suspended') actx.resume(); node = actx.createBufferSource(); node.buffer = abuf; node.connect(actx.destination); t0ctx = actx.currentTime + 0.03; node.start(t0ctx, T); }
  t0film = T; t0wall = performance.now(); playing = true; $('pp').textContent = '❚❚'; $('start').classList.add('hide'); document.body.classList.add('playing'); raf = requestAnimationFrame(frame);
}
function pause() { if (!playing) return; T = Math.min(DUR, now()); playing = false; stopNode(); cancelAnimationFrame(raf); $('pp').textContent = '▶'; document.body.classList.remove('playing'); }
function seek(t) { const was = playing; if (was) pause(); T = clamp(t, 0, DUR); draw(); $('time').textContent = `${fmt(T)} / ${fmt(DUR)}`; if (was) play(); }
const toggle = () => (playing ? pause() : play());
const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());

$('seek').max = DUR;
CHAPTERS.forEach(c => { const b = document.createElement('button'); b.textContent = c.n; b.onclick = () => { seek(c.t); if (!playing) play(); }; $('chapters').appendChild(b); });
$('go').onclick = () => { if (T >= DUR - 0.05) T = 0; play(); }; $('pp').onclick = toggle; $('fs').onclick = fs; cv.onclick = toggle;
$('seek').oninput = e => seek(+e.target.value);
addEventListener('resize', resize);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } else if (e.code === 'ArrowRight') seek(T + (e.shiftKey ? S16 : 2)); else if (e.code === 'ArrowLeft') seek(T - (e.shiftKey ? S16 : 2)); else if (e.code === 'KeyF') fs(); else if (e.code === 'Home') seek(0); });
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2200); };
addEventListener('mousemove', wake); addEventListener('touchstart', wake); wake();

const q = new URLSearchParams(location.search); if (q.has('t')) T = clamp(+q.get('t') || 0, 0, DUR);
resize(); $('time').textContent = `${fmt(T)} / ${fmt(DUR)}`;
window.film = { DUR, E, CHAPTERS, seek, play, pause, get t() { return T; }, get playing() { return playing; }, get audio() { return score ? { sr: score.sr, n: score.L.length, peak: score.peak } : null; },
  bench(n = 120) { const s = performance.now(); for (let i = 0; i < n; i++) { T = DUR * i / n; draw(); } return (performance.now() - s) / n; } };
// 配乐在本页合成；完成前也可以先点播放（那一次会是静音）
setTimeout(() => { const s = performance.now(); try { score = synthScore(); $('status').textContent = `配乐已在本页合成 · ${((performance.now() - s) / 1000).toFixed(1)} 秒`; } catch (e) { $('status').textContent = '配乐合成失败，将静音播放'; console.error(e); } $('go').disabled = false; document.body.classList.add('ready'); }, 60);

})();
</script>
